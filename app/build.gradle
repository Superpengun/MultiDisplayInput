plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def androidConfig = rootProject.ext.android

android {
    signingConfigs {
        release {
            storeFile file("demo.jks")
            storePassword '123456'
            keyAlias 'demo'
            keyPassword '123456'
//            storeFile file("bubble.jks")
//            storePassword 'android'
//            keyAlias 'bubble'
//            keyPassword 'android'

        }

        debug {
            storeFile file("demo.jks")
            storePassword '123456'
            keyAlias 'demo'
            keyPassword '123456'
//            storeFile file("bubble.jks")
//            storePassword 'android'
//            keyAlias 'bubble'
//            keyPassword 'android'
        }
    }

    compileSdk androidConfig.compileSdkVersion

    defaultConfig {
        applicationId "com.zqy.multidisplayinput"
        minSdkVersion androidConfig.minSdkVersion
        targetSdkVersion androidConfig.targetSdkVersion
        versionCode 1
        versionName "V2.2.0_" + releaseTime()

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
//        ndk{
//            abiFilters "armeabi-v7a" , "arm64-v8a"
//        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    aaptOptions {
        noCompress "dict"  //表示不让aapt压缩的文件后缀
    }
    namespace 'com.zqy.multidisplayinput'
}

android.applicationVariants.configureEach {
    variant ->
        variant.outputs.configureEach {
            output ->
                def outputFile = output.outputFile
                if (outputFile.name.contains("release")) {
                    def fileName = "zqy.multidisplayinput${variant.versionName}" + "_${variant.name}.apk"
                    outputFileName = new File("../release/", fileName)
                } else if (outputFile.name.contains("debug")) {
                    def fileName = "zqy.multidisplayinput${variant.versionName}" + "_${variant.name}.apk"
                    outputFileName = new File("../debug/", fileName)
                }
        }
}

gradle.projectsEvaluated {
    tasks.withType(JavaCompile).tap {
        configureEach {
            if (options.bootstrapClasspath != null) {
                Set<File> fileSet = options.bootstrapClasspath.getFiles()
                List<File> newFileList = new ArrayList<>()
                //JAVA语法，可连续调用，输入参数建议为相对路径
                newFileList.add(new File("libs/AndroidClass.jar"))
                //最后将原始参数添加
                newFileList.addAll(fileSet)
                options.bootstrapClasspath = files(
                        newFileList.toArray()
                )
            }
        }
    }
}

static def releaseTime() {
    return new Date().format("yyyyMMddHH", TimeZone.getTimeZone("GMT+8"))
}

dependencies {
    compileOnly files('libs/AndroidClass.jar')
    implementation project(path: ':parkingkeyboard')
    implementation "androidx.core:core-ktx:$androidxCoreKtx"
    implementation "androidx.appcompat:appcompat:$androidxAppCompat"
    implementation "com.google.android.material:material:$androidxMaterial"
    testImplementation 'junit:junit:4.13.2'
    implementation project(path: ':inputmethod')
    implementation project(path: ':inputengine')
    implementation project(path: ':common')
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'

    implementation "com.bytedance.tools.codelocator:codelocator-core:1.0.0"
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:3.0-alpha-8'
}